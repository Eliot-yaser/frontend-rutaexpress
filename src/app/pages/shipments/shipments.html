<div style="padding: 2rem; font-family: system-ui, sans-serif; max-width: 900px; margin: 0 auto;">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
    <h1 style="margin: 0; color: #111827;">Módulo de Envíos</h1>
    <a routerLink="/dashboard" style="padding: 8px 16px; background-color: #4b5563; color: white; text-decoration: none; border-radius: 6px; font-size: 14px; font-weight: 600;">
      ← Volver al Dashboard
    </a>
  </div>

  <table style="width: 100%; border-collapse: collapse; text-align: left; background: white; border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden;">
    <thead>
      <tr style="background-color: #f9fafb; border-bottom: 1px solid #e5e7eb;">
        <th style="padding: 12px 16px;">Código</th>
        <th style="padding: 12px 16px;">Destino</th>
        <th style="padding: 12px 16px;">Estado</th>
        <th style="padding: 12px 16px;">Fecha</th>
      </tr>
    </thead>
    <tbody>
      @for (item of shipments; track item.id) {
        <tr style="border-bottom: 1px solid #f3f4f6;">
          <td style="padding: 12px 16px; font-weight: 600;">{{ item.id }}</td>
          <td style="padding: 12px 16px;">{{ item.destination }}</td>
          <td style="padding: 12px 16px;">
            <span style="padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; background-color: #dbeafe; color: #1e40af;">
              {{ item.status }}
            </span>
          </td>
          <td style="padding: 12px 16px; color: #6b7280;">{{ item.date }}</td>
        </tr>
      }
    </tbody>
  </table>
</div>
