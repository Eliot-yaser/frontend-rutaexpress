<div style="padding: 2rem; font-family: system-ui, sans-serif; max-width: 900px; margin: 0 auto;">
  <header style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e5e7eb; padding-bottom: 1rem; margin-bottom: 2rem;">
    <div>
      <h1 style="margin: 0; color: #111827;">Panel de Control - RutaExpress</h1>
      <p style="margin: 0.5rem 0 0; color: #6b7280;">Usuario conectado: <strong>{{ userEmail }}</strong></p>
      <p style="margin: 0.25rem 0 0; color: #4b5563; font-size: 0.9rem;">
        Rol asignado: <span style="background: #e5e7eb; padding: 2px 8px; border-radius: 4px; font-weight: 600;">{{ userRoles.join(', ') }}</span>
      </p>
    </div>
    <button (click)="logout()" style="padding: 8px 16px; background-color: #ef4444; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600;">
      Cerrar Sesión
    </button>
  </header>

  <main>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 2rem;">
      <div style="background-color: #f3f4f6; padding: 1.5rem; border-radius: 8px; text-align: center;">
        <h3 style="margin: 0 0 0.5rem; color: #374151;">Envíos Activos</h3>
        <p style="font-size: 2rem; font-weight: bold; margin: 0; color: #2563eb;">12</p>
      </div>
      <div style="background-color: #f3f4f6; padding: 1.5rem; border-radius: 8px; text-align: center;">
        <h3 style="margin: 0 0 0.5rem; color: #374151;">Entregados Hoy</h3>
        <p style="font-size: 2rem; font-weight: bold; margin: 0; color: #16a34a;">5</p>
      </div>
    </div>

    <a routerLink="/shipments" style="display: inline-block; padding: 10px 20px; background-color: #2563eb; color: white; text-decoration: none; border-radius: 6px; font-weight: 600;">
      Ir al Módulo de Envíos
    </a>
  </main>
</div>
